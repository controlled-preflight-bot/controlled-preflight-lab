name: stage-b-candidate-runtime
on: pull_request
permissions:
  contents: write
jobs:
  upstream-write-attempt:
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/stage-b-forbidden-write-probe

